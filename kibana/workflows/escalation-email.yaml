name: escalation-email
description: Email the CISO and the IR on-call about a Tier 0 or Tier 1 compromise.
enabled: true
triggers:
  - type: manual
    inputs:
      - name: host
        type: string
        description: The name of the compromised host
        required: true
      - name: tier
        type: string
        description: The host's asset tier, 0 or 1
        required: true
      - name: summary
        type: string
        description: Two or three sentences on what happened and what has been affected
        required: true
steps:
  - name: email-responders
    type: email
    connector-id: __EMAIL_CONNECTOR_ID__
    with:
      to:
        - ciso@elastibank.example
        - ir-oncall@elastibank.example
      subject: "[Elastibank] Tier {{ inputs.tier }} compromise: {{ inputs.host }}"
      message: |
        A Tier {{ inputs.tier }} asset needs incident response within 15 minutes.

        Host: {{ inputs.host }}

        {{ inputs.summary }}
