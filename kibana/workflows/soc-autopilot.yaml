name: soc-autopilot
description: Run Attack Discovery, have the built-in AI agent summarise it, open a case and notify the IR on-call.
enabled: true
triggers:
  - type: manual
steps:
  - name: run-attack-discovery
    type: security.attack-discovery.run
    with:
      connector_id: __LLM_CONNECTOR_ID__
      mode: sync
      size: 100
      start: now-7d
      end: now
  # The run step only returns {execution_uuid, status: pending}, even in sync mode (it waits briefly, not for
  # the whole LLM run). Wait for generation to finish, then fetch the discoveries by that uuid.
  - name: wait-for-generation
    type: wait
    with:
      duration: 2m
  - name: fetch-discoveries
    type: kibana.request
    with:
      method: GET
      path: /api/attack_discovery/generations/{{ steps.run-attack-discovery.output.execution_uuid }}
  - name: summarise
    type: ai.agent
    agent-id: elastic-ai-agent
    with:
      message: |
        Give a three-line triage summary of these Attack Discovery results, naming the affected hosts and users.
        The discoveries are in the data array. If it is empty or generation.status is not succeeded, say so plainly.
        Answer only from the data below. Do not call any tools.
        {{ steps.fetch-discoveries.output | json }}
  - name: open-case
    type: cases.createCase
    with:
      title: "Autopilot: Attack Discovery triage"
      description: "{{ steps.summarise.output.message }}"
      tags:
        - autopilot
        - Elastibank Lab
      severity: high
      owner: securitySolution
  - name: notify
    type: email
    connector-id: __EMAIL_CONNECTOR_ID__
    with:
      to:
        - ir-oncall@elastibank.example
      subject: "[Elastibank] Autopilot opened a case"
      message: "{{ steps.summarise.output.message }}"
