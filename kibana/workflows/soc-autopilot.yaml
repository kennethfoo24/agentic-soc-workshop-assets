name: soc-autopilot
description: Run Attack Discovery, have the built-in AI agent summarise it, open a case and notify the IR on-call.
enabled: true
triggers:
  - type: manual
steps:
  - name: run-attack-discovery
    type: security.attack-discovery.run
    with:
      connector_id: __LLM_CONNECTOR_ID__
      mode: sync
      size: 100
      start: now-7d
      end: now
  # The run step returns only a run ID, so poll until this run's attack stories are saved.
  - name: wait-for-discoveries
    type: while
    max-iterations: 20
    condition: "${{ steps.fetch-discoveries.output.hits.total.value == 0 }}"
    steps:
      - name: pause
        type: wait
        with:
          duration: 15s
      - name: fetch-discoveries
        type: elasticsearch.search
        with:
          index: .adhoc.alerts-security.attack.discovery.alerts-default
          size: 10
          query:
            term:
              kibana.alert.rule.execution.uuid: "{{ steps.run-attack-discovery.output.execution_uuid }}"
          _source:
            - kibana.alert.attack_discovery.title_with_replacements
            - kibana.alert.attack_discovery.summary_markdown_with_replacements
            - kibana.alert.attack_discovery.entity_summary_markdown_with_replacements
            - kibana.alert.attack_discovery.mitre_attack_tactics
            - kibana.alert.risk_score
  - name: summarise
    type: ai.agent
    agent-id: elastic-ai-agent
    with:
      message: |
        Give a three-line triage summary of these Attack Discovery results, naming the affected hosts and users.
        If the list is empty, say Attack Discovery found nothing yet.
        Answer only from the data below. Do not call any tools.
        {{ steps.fetch-discoveries.output.hits.hits | json }}
  - name: open-case
    type: cases.createCase
    with:
      title: "Autopilot: Attack Discovery triage"
      description: "{{ steps.summarise.output.message }}"
      tags:
        - autopilot
        - Elastibank Lab
      severity: high
      owner: securitySolution
  - name: notify
    type: email
    connector-id: __EMAIL_CONNECTOR_ID__
    with:
      to:
        - ir-oncall@elastibank.example
      subject: "[Elastibank] Autopilot opened a case"
      message: "{{ steps.summarise.output.message }}"
